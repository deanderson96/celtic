name: Refresh Celtic season data

on:
  push:
    branches: [main]
    paths: ['.github/workflows/refresh-data.yml']
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-celtic-data
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install HTML parser
        run: npm install --no-save cheerio@1.0.0
      - name: Build complete season dataset
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import * as cheerio from 'cheerio';
          const API='https://www.thesportsdb.com/api/v1/json/123';
          const TEAM_ID='133647';
          const SPFL_TOTAL=38;
          const SPFL_CLUBS=12;
          const delay=ms=>new Promise(r=>setTimeout(r,ms));
          const clean=value=>String(value||'').replace(/\s+/g,' ').trim();
          const normalise=value=>String(value||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
          const currentSeason=()=>{const d=new Date(),y=d.getUTCFullYear();return d.getUTCMonth()>=6?`${y}-${y+1}`:`${y-1}-${y}`};
          const seedTransferNews=[
            {title:"West Ham eye Arne Engels and Everton pursue Alistair Johnston",url:"https://www.theguardian.com/football/2026/aug/04/football-transfer-rumour-mill-chelsea-mykhailo-mudryk-lampard-coventry",source:"The Guardian",publishedAt:"2026-08-04T08:00:00Z",kind:"Speculation"},
            {title:"Kasper Høgh completes club-record move from Bodø/Glimt",url:"https://www.skysports.com/football/news/11095/13566947/celtic-transfer-news-kasper-hogh-completes-club-record-move-from-bodo-glimt",source:"Sky Sports",publishedAt:"2026-07-28T14:48:00Z",kind:"Confirmed"},
            {title:"Daizen Maeda joins Ipswich as Celtic agree Høgh deal",url:"https://www.skysports.com/football/news/11781/13566221/daizen-maeda-transfer-news-ipswich-town-sign-celtic-forward-in-10m-deal",source:"Sky Sports",publishedAt:"2026-07-26T15:37:00Z",kind:"Confirmed"},
            {title:"Celtic struggling to compete in transfer market, meeting notes reveal",url:"https://www.skysports.com/football/news/11787/13564215/celtic-transfer-news-scottish-premiership-champions-struggling-to-compete-in-market-meeting-notes-reveal",source:"Sky Sports",publishedAt:"2026-07-17T17:45:00Z",kind:"Report"},
            {title:"Celtic sign Colombian forward Camilo Durán on five-year deal",url:"https://www.celticfc.com/news/2026/july/10/celtic-are-delighted-to-sign-colombian-forward--camilo-duran-/",source:"Celtic FC",publishedAt:"2026-07-10T07:00:00Z",kind:"Official"},
            {title:"Alex Oxlade-Chamberlain signs new one-year Celtic deal",url:"https://www.celticfc.com/news/2026/july/04/alex-oxlade-chamberlain-signs-new-one-year-deal-with-the-champions/",source:"Celtic FC",publishedAt:"2026-07-04T07:44:00Z",kind:"Official"}
          ];
          async function json(path){const r=await fetch(`${API}/${path}`,{headers:{'User-Agent':'celtic-fc-hub/1.0'}});if(!r.ok)throw new Error(`${path}: ${r.status}`);return r.json()}
          async function html(url){const r=await fetch(url,{headers:{'User-Agent':'celtic-fc-hub/1.0'}});if(!r.ok)throw new Error(`${url}: ${r.status}`);return r.text()}
          async function lookupMany(ids,endpoint,key){const out=[];for(const id of ids){try{const data=await json(`${endpoint}?id=${id}`),item=(data[key]||[])[0];if(item)out.push(item)}catch(e){console.warn(e.message)}await delay(2150)}return out}
          async function officialSpflTable(){
            const markup=await html('https://spfl.co.uk/league/premiership/table');
            const $=cheerio.load(markup);
            let best=[];
            $('table').each((_,tableEl)=>{
              const tableNode=$(tableEl);
              const headers=tableNode.find('thead tr').last().find('th,td').map((__,cell)=>clean($(cell).text()).toLowerCase()).get();
              const findIndex=patterns=>headers.findIndex(label=>patterns.some(pattern=>pattern.test(label)));
              const idxPos=findIndex([/^pos/,/^#$/]);
              const idxTeam=findIndex([/^team/,/^club/]);
              const idxPlayed=findIndex([/^pld/,/^played/,/^p$/]);
              const idxWin=findIndex([/^w$/,/^won/]);
              const idxDraw=findIndex([/^d$/,/^draw/]);
              const idxLoss=findIndex([/^l$/,/^lost/]);
              const idxGd=findIndex([/^gd$/,/^goal difference/]);
              const idxPts=findIndex([/^pts/,/^points/]);
              const rows=[];
              tableNode.find('tbody tr').each((__,rowEl)=>{
                const cells=$(rowEl).find('th,td').map((___,cell)=>clean($(cell).text())).get();
                if(cells.length<5)return;
                const posCell=cells[idxPos>=0?idxPos:0];
                const teamCell=cells[idxTeam>=0?idxTeam:1];
                const rank=Number.parseInt(posCell,10);
                if(!Number.isFinite(rank)||!teamCell)return;
                const value=(index,fallback='')=>index>=0&&cells[index]!=null?cells[index]:fallback;
                const played=value(idxPlayed,cells[2]||'');
                const gd=value(idxGd,cells.length===5?cells[3]:'');
                const pts=value(idxPts,cells.length===5?cells[4]:cells[cells.length-1]);
                rows.push({
                  intRank:String(rank),intPosition:String(rank),name:teamCell,strTeam:teamCell,
                  intPlayed:played,intWin:value(idxWin,''),intDraw:value(idxDraw,''),intLoss:value(idxLoss,''),
                  intGoalDifference:gd,intPoints:pts,strForm:''
                });
              });
              if(rows.some(row=>/^celtic$/i.test(row.name))&&rows.length>best.length)best=rows;
            });
            best=best.sort((a,b)=>Number(a.intRank)-Number(b.intRank)).slice(0,SPFL_CLUBS);
            if(best.length!==SPFL_CLUBS)throw new Error(`Official SPFL table returned ${best.length}/${SPFL_CLUBS} clubs`);
            return best;
          }
          let previous={};try{previous=JSON.parse(await fs.readFile('data.json','utf8'))}catch{}
          const season=currentSeason();
          const team=(await json(`lookupteam.php?id=${TEAM_ID}`)).teams?.[0]||null;
          const teamHtml=await html(`https://www.thesportsdb.com/team/${TEAM_ID}-celtic`);
          const $team=cheerio.load(teamHtml);
          const competitions=new Map();
          $team('a[href*="/league/"]').each((_,a)=>{const href=$team(a).attr('href')||'',m=href.match(/\/league\/(\d+)-([^?#]+)/);if(m)competitions.set(m[1],m[2])});
          if(team?.idLeague)competitions.set(String(team.idLeague),'scottish-premier-league');
          const eventIds=new Set();
          const collectEvents=markup=>{const $=cheerio.load(markup);$('a[href*="/event/"]').each((_,a)=>{const m=($(a).attr('href')||'').match(/\/event\/(\d+)/);if(m)eventIds.add(m[1])})};
          collectEvents(teamHtml);
          for(const [leagueId,slug] of competitions){try{const url=`https://www.thesportsdb.com/season/${leagueId}-${slug}/${season}%26t%3D${TEAM_ID}-celtic`;collectEvents(await html(url));console.log('Competition',leagueId,slug)}catch(e){console.warn(e.message)}await delay(700)}
          if(!eventIds.size){for(const leagueId of competitions.keys()){try{const data=await json(`eventsseason.php?id=${leagueId}&s=${season}`);for(const e of data.events||[])if(String(e.idHomeTeam)===TEAM_ID||String(e.idAwayTeam)===TEAM_ID)eventIds.add(e.idEvent)}catch(e){console.warn(e.message)}}}
          const fixtures=await lookupMany([...eventIds],'lookupevent.php','events');
          let apiTable=[];try{apiTable=(await json(`lookuptable.php?l=${team?.idLeague||4330}&s=${season}`)).table||[]}catch(e){console.warn(e.message)}
          let table=[];
          try{
            const official=await officialSpflTable();
            const apiByName=new Map(apiTable.map(row=>[normalise(row.name||row.strTeam),row]));
            table=official.map(row=>({...apiByName.get(normalise(row.name)),...row}));
            console.log(`Loaded official SPFL table: ${table.length}/${SPFL_CLUBS} clubs`);
          }catch(e){
            console.warn('Official SPFL table:',e.message);
            table=(previous.table||[]).length===SPFL_CLUBS?previous.table:apiTable;
          }
          fixtures.sort((a,b)=>`${a.dateEvent||''} ${a.strTime||''}`.localeCompare(`${b.dateEvent||''} ${b.strTime||''}`));
          const now=Date.now()-10800000,next=fixtures.find(e=>e.intHomeScore==null&&Date.parse(`${e.dateEvent}T${(e.strTime||'15:00:00').slice(0,8)}Z`)>=now)||fixtures.find(e=>e.intHomeScore==null)||null;
          let preview=null;if(next){const [homeTeam,awayTeam,homeRecent,awayRecent]=await Promise.all([json(`lookupteam.php?id=${next.idHomeTeam}`).then(x=>x.teams?.[0]||null).catch(()=>null),json(`lookupteam.php?id=${next.idAwayTeam}`).then(x=>x.teams?.[0]||null).catch(()=>null),json(`eventslast.php?id=${next.idHomeTeam}`).then(x=>x.results||[]).catch(()=>[]),json(`eventslast.php?id=${next.idAwayTeam}`).then(x=>x.results||[]).catch(()=>[])]);preview={event:next,homeTeam,awayTeam,homeRecent,awayRecent}}
          let transferNews=(previous.transferNews||[]).length?previous.transferNews:seedTransferNews;
          try{
            const queries=['Celtic transfer when:21d','Celtic signing when:21d','Celtic linked target bid when:21d'];
            const seen=new Set(),items=[];
            for(const q of queries){const xml=await html(`https://news.google.com/rss/search?q=${encodeURIComponent(q)}&hl=en-GB&gl=GB&ceid=GB:en`),$news=cheerio.load(xml,{xmlMode:true});$news('item').each((_,item)=>{const node=$news(item),source=node.find('source').text().trim(),rawTitle=node.find('title').text().trim();if(!/(Celtic FC|BBC|Sky Sports|The Guardian|The Athletic|STV|The Herald|ESPN)/i.test(source)||!/celtic/i.test(rawTitle)||/women|women's/i.test(rawTitle))return;const suffix=` - ${source}`,title=rawTitle.toLowerCase().endsWith(suffix.toLowerCase())?rawTitle.slice(0,-suffix.length).trim():rawTitle.trim(),key=normalise(title);if(seen.has(key))return;seen.add(key);const lower=title.toLowerCase(),kind=/celtic fc/i.test(source)?'Official':/signs|signed|joins|joined|completes|completed|agrees|agreed|club-record|permanent switch/i.test(lower)?'Confirmed':/linked|target|interest|monitor|eyeing|want|rumour|could|bid|pursuing/i.test(lower)?'Speculation':'Report';items.push({title,url:node.find('link').text().trim(),source,publishedAt:new Date(node.find('pubDate').text().trim()).toISOString(),kind})})}
            const fresh=items.sort((a,b)=>new Date(b.publishedAt)-new Date(a.publishedAt)).slice(0,9);if(fresh.length)transferNews=fresh;
          }catch(e){console.warn('Transfer news:',e.message)}
          const leaguePublished=fixtures.filter(e=>String(e.idLeague||'')===String(team?.idLeague||4330)).length;
          const data={generatedAt:new Date().toISOString(),season,team,fixtures,table,preview,transferNews,coverage:{competitions:[...competitions.entries()].map(([id,slug])=>({id,slug})),eventCount:fixtures.length,leaguePublished,leagueTarget:SPFL_TOTAL,tableTeams:table.length,tableTarget:SPFL_CLUBS}};
          await fs.writeFile('data.json',JSON.stringify(data));
          console.log(`Wrote ${fixtures.length} fixtures (${leaguePublished}/${SPFL_TOTAL} league), ${table.length}/${SPFL_CLUBS} table clubs and ${transferNews.length} transfer stories`);
          NODE
      - name: Publish refreshed data
        run: |
          cp data.json /tmp/celtic-data.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/celtic-data.json data.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet && exit 0
          git commit -m "Refresh Celtic season data"
          git push origin HEAD:main
