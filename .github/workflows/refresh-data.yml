name: Refresh Celtic season data

on:
  push:
    branches: [main]
    paths: ['.github/workflows/refresh-data.yml']
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-celtic-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install HTML parser
        run: npm install --no-save cheerio@1.0.0
      - name: Build complete season dataset
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import * as cheerio from 'cheerio';
          const API='https://www.thesportsdb.com/api/v1/json/123';
          const TEAM_ID='133647';
          const SPFL_TOTAL=38;
          const delay=ms=>new Promise(r=>setTimeout(r,ms));
          const normalise=value=>String(value||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
          const currentSeason=()=>{const d=new Date(),y=d.getUTCFullYear();return d.getUTCMonth()>=6?`${y}-${y+1}`:`${y-1}-${y}`};
          async function json(path){const r=await fetch(`${API}/${path}`,{headers:{'User-Agent':'celtic-fc-hub/1.0'}});if(!r.ok)throw new Error(`${path}: ${r.status}`);return r.json()}
          async function html(url){const r=await fetch(url,{headers:{'User-Agent':'celtic-fc-hub/1.0'}});if(!r.ok)throw new Error(`${url}: ${r.status}`);return r.text()}
          async function lookupMany(ids,endpoint,key){const out=[];for(const id of ids){try{const data=await json(`${endpoint}?id=${id}`),item=(data[key]||[])[0];if(item)out.push(item)}catch(e){console.warn(e.message)}await delay(2150)}return out}
          let previous={};try{previous=JSON.parse(await fs.readFile('data.json','utf8'))}catch{}
          const season=currentSeason();
          const team=(await json(`lookupteam.php?id=${TEAM_ID}`)).teams?.[0]||null;
          const teamHtml=await html(`https://www.thesportsdb.com/team/${TEAM_ID}-celtic`);
          const $team=cheerio.load(teamHtml);
          const competitions=new Map();
          $team('a[href*="/league/"]').each((_,a)=>{const href=$team(a).attr('href')||'',m=href.match(/\/league\/(\d+)-([^?#]+)/);if(m)competitions.set(m[1],m[2])});
          if(team?.idLeague)competitions.set(String(team.idLeague),'scottish-premier-league');
          const eventIds=new Set();
          const collectEvents=markup=>{const $=cheerio.load(markup);$('a[href*="/event/"]').each((_,a)=>{const m=($(a).attr('href')||'').match(/\/event\/(\d+)/);if(m)eventIds.add(m[1])})};
          collectEvents(teamHtml);
          for(const [leagueId,slug] of competitions){try{const url=`https://www.thesportsdb.com/season/${leagueId}-${slug}/${season}%26t%3D${TEAM_ID}-celtic`;collectEvents(await html(url));console.log('Competition',leagueId,slug)}catch(e){console.warn(e.message)}await delay(700)}
          if(!eventIds.size){for(const leagueId of competitions.keys()){try{const data=await json(`eventsseason.php?id=${leagueId}&s=${season}`);for(const e of data.events||[])if(String(e.idHomeTeam)===TEAM_ID||String(e.idAwayTeam)===TEAM_ID)eventIds.add(e.idEvent)}catch(e){console.warn(e.message)}}}
          const fixtures=await lookupMany([...eventIds],'lookupevent.php','events');

          const officialHtml=await html('https://www.celticfc.com/teams/');
          const $official=cheerio.load(officialHtml);
          const tokens=$official('body').text().split(/\n+/).map(x=>x.trim()).filter(Boolean);
          const start=tokens.lastIndexOf('Goalkeepers'),end=tokens.indexOf('Team Overview',start);
          const officialRoster=[];let group='Player';
          for(let i=Math.max(start,0);i<(end>start?end:tokens.length);i++){
            if(['Goalkeepers','Defenders','Midfielders','Forwards'].includes(tokens[i])){group=tokens[i];continue}
            if(tokens[i+1]==='Profile Unavailable')officialRoster.push({name:tokens[i],position:group==='Goalkeepers'?'Goalkeeper':group==='Defenders'?'Defender':group==='Midfielders'?'Midfielder':group==='Forwards'?'Forward':'Player'});
          }
          const playerIds=new Set();
          $team('a[href*="/player/"]').each((_,a)=>{const m=($team(a).attr('href')||'').match(/\/player\/(\d+)/);if(m)playerIds.add(m[1])});
          const candidates=await lookupMany([...playerIds],'lookupplayer.php','players');
          const byName=new Map(candidates.map(p=>[normalise(p.strPlayer),p]));
          const players=[];
          for(const member of officialRoster){let player=byName.get(normalise(member.name));if(!player){try{const result=await json(`searchplayers.php?p=${encodeURIComponent(member.name)}`);player=(result.player||[]).find(p=>normalise(p.strPlayer)===normalise(member.name)&&(String(p.idTeam||'')===TEAM_ID||/celtic/i.test(p.strTeam||'')))||null}catch(e){console.warn(e.message)}await delay(2150)}players.push(player||{idPlayer:`official-${normalise(member.name)}`,idTeam:TEAM_ID,strTeam:'Celtic',strPlayer:member.name,strPosition:member.position,strNationality:'',strStatus:'Active'})}

          let table=[];try{table=(await json(`lookuptable.php?l=${team?.idLeague||4330}&s=${season}`)).table||[]}catch(e){console.warn(e.message)}
          fixtures.sort((a,b)=>`${a.dateEvent||''} ${a.strTime||''}`.localeCompare(`${b.dateEvent||''} ${b.strTime||''}`));
          const now=Date.now()-10800000,next=fixtures.find(e=>e.intHomeScore==null&&Date.parse(`${e.dateEvent}T${(e.strTime||'15:00:00').slice(0,8)}Z`)>=now)||fixtures.find(e=>e.intHomeScore==null)||null;
          let preview=null;if(next){const [homeTeam,awayTeam,homeRecent,awayRecent]=await Promise.all([json(`lookupteam.php?id=${next.idHomeTeam}`).then(x=>x.teams?.[0]||null).catch(()=>null),json(`lookupteam.php?id=${next.idAwayTeam}`).then(x=>x.teams?.[0]||null).catch(()=>null),json(`eventslast.php?id=${next.idHomeTeam}`).then(x=>x.results||[]).catch(()=>[]),json(`eventslast.php?id=${next.idAwayTeam}`).then(x=>x.results||[]).catch(()=>[])]);preview={event:next,homeTeam,awayTeam,homeRecent,awayRecent}}

          let transferNews=previous.transferNews||[];
          try{
            const query=encodeURIComponent('Celtic (transfer OR signing OR linked OR target OR bid OR deal) when:21d');
            const xml=await html(`https://news.google.com/rss/search?q=${query}&hl=en-GB&gl=GB&ceid=GB:en`);
            const $news=cheerio.load(xml,{xmlMode:true});
            const approved=/^(Celtic FC|BBC Sport|Sky Sports|The Guardian|The Athletic|STV News|The Herald|ESPN)$/i;
            const seen=new Set(),items=[];
            $news('item').each((_,item)=>{const node=$news(item),source=node.find('source').text().trim(),rawTitle=node.find('title').text().trim();if(!approved.test(source)||!/celtic/i.test(rawTitle)||/women|women's/i.test(rawTitle))return;const title=rawTitle.replace(new RegExp(`\\s+-\\s+${source.replace(/[.*+?^${}()|[\\]\\]/g,'\\$&')}$`,'i'),'').trim(),key=normalise(title);if(seen.has(key))return;seen.add(key);const lower=title.toLowerCase(),kind=/celtic fc/i.test(source)?'Official':/signs|signed|joins|joined|completes|completed|agrees|agreed|club-record|permanent switch/i.test(lower)?'Confirmed':/linked|target|interest|monitor|eyeing|want|rumour|could|bid|pursuing/i.test(lower)?'Speculation':'Report';items.push({title,url:node.find('link').text().trim(),source,publishedAt:new Date(node.find('pubDate').text().trim()).toISOString(),kind})});
            const fresh=items.sort((a,b)=>new Date(b.publishedAt)-new Date(a.publishedAt)).slice(0,9);if(fresh.length)transferNews=fresh;
          }catch(e){console.warn('Transfer news:',e.message)}

          const leaguePublished=fixtures.filter(e=>String(e.idLeague||'')===String(team?.idLeague||4330)).length;
          const data={generatedAt:new Date().toISOString(),season,team,fixtures,players,table,preview,transferNews,coverage:{competitions:[...competitions.entries()].map(([id,slug])=>({id,slug})),eventCount:fixtures.length,playerCount:players.length,leaguePublished,leagueTarget:SPFL_TOTAL}};
          await fs.writeFile('data.json',JSON.stringify(data));
          console.log(`Wrote ${fixtures.length} fixtures (${leaguePublished}/${SPFL_TOTAL} league), ${players.length} players and ${transferNews.length} transfer stories`);
          NODE
      - name: Publish refreshed data
        run: |
          cp data.json /tmp/celtic-data.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/celtic-data.json data.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet && exit 0
          git commit -m "Refresh Celtic season data"
          git push origin HEAD:main
